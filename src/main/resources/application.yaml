spring:
  application:
    name: cloudclip

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudclip}
    username: ${DB_USERNAME:cloudclip}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

file-storage:
  path: ${FILE_STORAGE_PATH:./storage/files}