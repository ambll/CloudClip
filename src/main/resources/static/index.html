<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudClip</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <h1>CloudClip</h1>

    <a href="/create-room.html" class="create-room-button">
        Создать комнату
    </a>
</header>

<main>

    <section id="joinRoom">

        <h2>Войти в комнату</h2>

        <form id="joinRoomForm">

            <input
                    type="text"
                    id="roomKey"
                    placeholder="Введите ключ комнаты"
                    required
            >

            <button type="submit">
                Открыть
            </button>

        </form>

    </section>

</main>

<script src="/js/index.js"></script>

</body>
</html>
