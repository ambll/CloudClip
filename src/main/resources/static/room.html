<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Комната — CloudClip</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>

    <div>
        <h1 id="roomName">Комната</h1>

        <a href="/" class="back-button">
            ← К комнатам
        </a>
    </div>

    <div class="room-menu">

        <button
                id="roomMenuButton"
                class="room-menu-button"
                type="button"
        >
            ⋮
        </button>

        <div
                id="roomMenu"
                class="room-menu-dropdown"
                style="display: none;"
        >
            <button id="renameRoomButton">
                Переименовать
            </button>

            <button id="changeRoomPasswordButton">
                Изменить пароль комнаты
            </button>

            <button id="changeOwnerPasswordButton">
                Изменить пароль владельца
            </button>

            <button
                    id="deleteRoomButton"
                    class="danger"
            >
                Удалить комнату
            </button>
        </div>

    </div>

</header>


<!-- Модальное окно пароля комнаты -->

<div
        id="passwordModal"
        class="modal"
        style="display: none;"
>
    <div class="modal-content">

        <h2>Комната защищена</h2>

        <p>
            Для доступа к содержимому комнаты
            введите пароль.
        </p>

        <form id="passwordForm">

            <input
                    type="password"
                    id="passwordInput"
                    placeholder="Пароль"
                    autocomplete="current-password"
                    required
            >

            <button type="submit">
                Войти
            </button>

        </form>

        <p
                id="passwordError"
                class="modal-error"
                style="display: none;"
        ></p>

    </div>
</div>


<!-- Модальное окно удаления комнаты -->

<div
        id="deleteRoomModal"
        class="modal"
        style="display: none;"
>
    <div class="modal-content">

        <h2>Удалить комнату?</h2>

        <p>
            Это действие нельзя отменить.
            Все содержимое комнаты будет удалено.
        </p>

        <form id="deleteRoomForm">

            <input
                    type="password"
                    id="ownerPasswordInput"
                    placeholder="Пароль владельца"
                    autocomplete="current-password"
                    required
            >

            <div class="modal-buttons">

                <button
                        type="button"
                        id="cancelDeleteRoomButton"
                >
                    Отмена
                </button>

                <button
                        type="submit"
                        class="danger-button"
                >
                    Удалить
                </button>

            </div>

        </form>

        <p
                id="deleteRoomError"
                class="modal-error"
                style="display: none;"
        ></p>

    </div>
</div>


<main>

    <div
            id="errorMessage"
            style="display: none;"
    ></div>


    <div id="roomContent">

        <section id="roomInfo">

            <p id="roomVisibility"></p>

            <p id="roomExpiration"></p>

        </section>


        <section id="createItem">

            <h2>Добавить текст</h2>

            <textarea
                    id="textInput"
                    placeholder="Введите текст..."
            ></textarea>

            <button id="addTextButton">
                Добавить
            </button>

        </section>


        <section id="createFileItem">

            <h2>Добавить файл</h2>

            <input
                    type="file"
                    id="fileInput"
            >

            <button id="addFileButton">
                Загрузить
            </button>

        </section>


        <section>

            <h2>Содержимое</h2>

            <div id="items"></div>

        </section>

    </div>

</main>


<script src="/js/room.js"></script>

</body>
</html>
